<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seguimiento de Labores">
  <defs>
    <linearGradient id="pL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EABB44"/><stop offset="1" stop-color="#B77A1C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pL)"/>
  <path d="M2 30A16 16 0 0 1 18 2h28A16 16 0 0 0 2 30Z" fill="#fff" opacity=".10"/>
  <rect x="2.6" y="2.6" width="58.8" height="58.8" rx="15.4" fill="none" stroke="#fff" stroke-opacity=".2"/>
  <!-- surcos de campo -->
  <g fill="none" stroke="#7A4E12" stroke-width="2.6" stroke-linecap="round" opacity=".5">
    <path d="M8 54 Q 32 49 56 54"/>
  </g>
  <!-- caña al fondo -->
  <path d="M13 40c-1-8 1-15 6-19 0 8-2 14-6 19Z" fill="#2C8E1E"/>
  <path d="M14 40c-3-2-5-6-5-11 3 2 5 6 5 11Z" fill="#8CC63F"/>
  <!-- tractor (mecanizado) -->
  <g>
    <path d="M30 44 v-7 h6 l2-5 h7 l2 5 h2 a2 2 0 0 1 2 2 v5" fill="#164E7A"/>
    <circle cx="49" cy="45" r="6" fill="#0E3252" stroke="#EAFBEF" stroke-width="2"/>
    <circle cx="49" cy="45" r="2" fill="#EAFBEF"/>
    <circle cx="35" cy="46" r="4.2" fill="#0E3252" stroke="#EAFBEF" stroke-width="1.8"/>
    <circle cx="35" cy="46" r="1.4" fill="#EAFBEF"/>
  </g>
  <!-- trabajador (manual) -->
  <g fill="#EAFBEF">
    <circle cx="20" cy="30" r="3.4"/>
    <path d="M20 34 c-3 0-5 2-5 5 v6 h4 v-5 l1-2 1 2 v5 h4 v-6 c0-3-2-5-5-5Z"/>
    <!-- herramienta manual -->
    <path d="M25 33 l7-7" stroke="#7A4E12" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M31 24 l3 3" stroke="#EAFBEF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
