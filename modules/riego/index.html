    <link rel="stylesheet" crossorigin href="./assets/index-B0LwgFY-.css">
    <style id="r742-visual-tuning">
      /* R7.4.2 · capa visual complementaria. Mantiene identidad CASUR. */
      .r741-kpis > div { position: relative; overflow: hidden; box-shadow: none; }
      .r741-kpis > div::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
      .r741-kpis > div:nth-child(1) { background: #f4f9fb; border-color: #dcecef; }
      .r741-kpis > div:nth-child(1)::before { background: #0b76b7; }
      .r741-kpis > div:nth-child(2) { background: #f3fafc; border-color: #d9edf1; }
      .r741-kpis > div:nth-child(2)::before { background: #38bde5; }
      .r741-kpis > div:nth-child(3) { background: #fffaf2; border-color: #eee2cf; }
      .r741-kpis > div:nth-child(3)::before { background: #d49a35; }
      .r741-kpis > div:nth-child(4) { background: #f5faf5; border-color: #dce9d8; }
      .r741-kpis > div:nth-child(4)::before { background: #65a34b; }

      .r741-audit-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        margin: 14px 0;
        border: 1px solid #dce8ea;
        border-radius: 16px;
        background: #f8fbfb;
        overflow: hidden;
      }
      .r741-audit-strip > div {
        min-width: 0;
        padding: 13px 14px 12px;
        border-right: 1px solid #e1ebed;
        background: transparent;
      }
      .r741-audit-strip > div:last-child { border-right: 0; }
      .r741-audit-strip span {
        display: block;
        min-height: 24px;
        color: #718793;
        font-size: 8px;
        line-height: 1.35;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .055em;
      }
      .r741-audit-strip strong {
        display: block;
        margin-top: 5px;
        color: #123d56;
        font-size: 16px;
        line-height: 1.15;
        letter-spacing: -.02em;
      }

      .r741-metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        margin: 12px 0 9px;
      }
      .r741-metric-grid button {
        min-height: 91px;
        text-align: left;
        border: 1px solid #d9e7e9;
        border-radius: 15px;
        padding: 12px 14px;
        background: #fbfdfd;
        box-shadow: none;
      }
      .r741-metric-grid button:nth-child(2) { background: #fbfdf9; border-color: #dfe9dc; }
      .r741-metric-grid button:disabled { opacity: 1; cursor: default; }
      .r741-metric-grid span {
        display: block;
        color: #718793;
        font-size: 8px;
        line-height: 1.3;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .055em;
      }
      .r741-metric-grid strong {
        display: block;
        margin: 6px 0 4px;
        color: #0b6f9d;
        font-size: 17px;
        line-height: 1.2;
        letter-spacing: -.02em;
      }
      .r741-metric-grid strong.risk { color: #b4453f; }
      .r741-metric-grid button:disabled strong { color: #59717d; font-size: 15px; }
      .r741-metric-grid small { display: block; color: #7c9099; font-size: 9px; line-height: 1.4; }

      .r741-history-btn {
        min-height: 38px;
        border: 1px solid #bcd9e1;
        border-radius: 11px;
        padding: 0 13px;
        background: #eef8fa;
        color: #0c6689;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
      }
      .r741-history-btn:hover:not(:disabled) { background: #e3f4f7; border-color: #8fc8d6; }
      .r741-history-btn:disabled {
        cursor: default;
        color: #738891;
        background: #f5f8f8;
        border-color: #dce6e7;
      }

      .r741-history { margin: 11px 0 15px; border: 1px solid #dce8ea; border-radius: 16px; padding: 14px; background: #f8fbfb; }
      .r741-history > strong { display: block; color: #173e54; font-size: 12px; }
      .r741-history > small { display: block; color: #748994; font-size: 9px; line-height: 1.45; margin: 4px 0 10px; }
      .r741-history-scroll { overflow-x: auto; }
      .r741-history-grid { display: grid; gap: 7px; min-width: 980px; }
      .r741-history-row { display: grid; grid-template-columns: 72px 130px 130px 95px 105px 95px 95px 95px minmax(160px,1fr); gap: 8px; align-items: center; padding: 9px 10px; border: 1px solid #e2ecee; border-radius: 11px; background: #fff; font-size: 11px; }
      .r741-history-row.open { border-color: #ead7b0; background: #fffaf2; }
      .r741-history-row span small { display: block; color: #80939b; font-size: 8px; margin-bottom: 2px; }
      .last-report-age { font-size: 8px !important; color: #718995 !important; white-space: nowrap; }

      /* El panel global conserva el azul CASUR, pero los estados aún no calculables dejan de competir con los KPI reales. */
      .freq-panel { padding: 18px 22px; }
      .freq-stat strong.r742-pending {
        width: fit-content;
        margin-top: 4px;
        padding: 5px 9px;
        border: 1px solid #ffffff24;
        border-radius: 9px;
        background: #ffffff12;
        color: #c4dbe5;
        font-size: 13px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      @media (max-width: 760px) {
        .r741-audit-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .r741-audit-strip > div { border-right: 1px solid #e1ebed; border-bottom: 1px solid #e1ebed; }
        .r741-audit-strip > div:nth-child(2n) { border-right: 0; }
        .r741-audit-strip > div:nth-last-child(-n+2) { border-bottom: 0; }
        .r741-metric-grid { grid-template-columns: 1fr; }
        .r741-metric-grid button { min-height: 78px; }
        .r741-kpis { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
      }
    </style>
