    <style id="r743-executive-tuning">
      /* R7.4.3 · jerarquía ejecutiva: cada KPI tiene una función y un acento semántico. */
      .r743-statusline { margin: 16px 0 14px; padding: 10px 13px; border-radius: 12px; background: #f3f8f8; color: #607a86; font-size: 11px; }
      .r743-kpis > .r743-kpi { position: relative; overflow: hidden; min-height: 94px; padding-left: 14px; box-shadow: none; }
      .r743-kpis > .r743-kpi::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; }
      .r743-kpis > .r743-kpi.riegos { background:#f4f9fc; border-color:#dbeaf0; }
      .r743-kpis > .r743-kpi.riegos::before { background:#0b76b7; }
      .r743-kpis > .r743-kpi.area { background:#f1fbfd; border-color:#d5edf2; }
      .r743-kpis > .r743-kpi.area::before { background:#38bde5; }
      .r743-kpis > .r743-kpi.cierre { background:#f6faf5; border-color:#dce9d8; }
      .r743-kpis > .r743-kpi.cierre::before { background:#65a34b; }
      .r743-kpis > .r743-kpi.cierre.warn { background:#fffaf2; border-color:#eee2cf; }
      .r743-kpis > .r743-kpi.cierre.warn::before { background:#d99424; }
      .r743-kpis > .r743-kpi.cierre.danger { background:#fff6f5; border-color:#efd9d7; }
      .r743-kpis > .r743-kpi.cierre.danger::before { background:#d94b48; }
      .r743-kpis > .r743-kpi.objetivo { background:#f5faf5; border-color:#dce9d8; }
      .r743-kpis > .r743-kpi.objetivo::before { background:#78ad55; }
      .r743-kpis .r743-kpi strong { font-size:18px; letter-spacing:-.02em; }
      .r743-context { display:flex; flex-wrap:wrap; gap:6px 16px; margin:10px 3px 2px; color:#6a818c; font-size:10px; line-height:1.45; }
      .r743-context span + span::before { content:"•"; margin-right:12px; color:#a1b2b9; }
      .r743-context b { color:#294f61; }
      .r743-history-note { display:flex; align-items:flex-start; gap:9px; margin:14px 0 12px; padding:11px 13px; border:1px solid #dce7e8; border-radius:12px; background:#f7faf9; color:#657d87; font-size:10px; line-height:1.5; }
      .r743-history-note svg { flex:0 0 auto; color:#0b76b7; margin-top:1px; }
      .r743-history-note strong { color:#294f61; }
      .r743-history-note.warn { background:#fff8ed; border-color:#eddcbd; color:#836329; }
      .r743-history-note.warn svg { color:#d38a20; }
      .r743-history-note.warn strong { color:#8d5b16; }
      .r743-history-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:14px 0 9px; }
      .r743-history-summary button { min-height:82px; text-align:left; border:1px solid #dbe7e9; border-radius:14px; padding:11px 13px; background:#f9fcfc; }
      .r743-history-summary button:nth-child(2) { background:#f8fcf5; border-color:#dfe9dc; }
      .r743-history-summary button:disabled { opacity:1; cursor:default; }
      .r743-history-summary span { display:block; font-size:8px; text-transform:uppercase; letter-spacing:.055em; color:#728893; font-weight:800; }
      .r743-history-summary strong { display:block; margin:6px 0 3px; color:#0b6f9d; font-size:17px; }
      .r743-history-summary strong.risk { color:#b4453f; }
      .r743-history-summary small { color:#7b9099; font-size:9px; }
      .r743-history-btn { min-height:36px; border:1px solid #bcd9e1; border-radius:10px; padding:0 13px; background:#eef8fa; color:#0c6689; font-size:10px; font-weight:800; }
      .r743-struct { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .r743-freq { padding:19px 22px; }
      .r743-freq-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
      .r743-freq-stat { min-width:0; padding:2px 18px; border-left:1px solid #ffffff24; }
      .r743-freq-stat:first-child { border-left:0; padding-left:0; }
      .r743-freq-stat span { display:block; min-height:26px; color:#add1df; font-size:9px; line-height:1.35; text-transform:uppercase; letter-spacing:.05em; }
      .r743-freq-stat strong { display:block; margin-top:6px; color:#8eddf0; font-size:24px; letter-spacing:-.03em; }
      .r743-freq-stat.target strong { color:#7fd4ef; }
      .r743-freq-stat.compliance strong { color:#9ae0a7; }
      .r743-freq-stat.historical strong { color:#d7e9ef; }
      .r743-freq-stat.historical strong.over { color:#ff9d8a; }
      .r743-freq-stat small { display:block; margin-top:3px; color:#9fc1cf; font-size:8px; line-height:1.35; }
      .r743-freq-note { margin:14px 0 0; padding-top:11px; border-top:1px solid #ffffff18; color:#bad4de; font-size:9px; line-height:1.45; }
      @media (max-width:760px) {
        .r743-kpis { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
        .r743-context span + span::before { display:none; }
        .r743-history-summary { grid-template-columns:1fr; }
        .r743-freq-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 0; }
        .r743-freq-stat:nth-child(3) { border-left:0; padding-left:0; }
        .r743-freq-stat strong { font-size:20px; }
      }
