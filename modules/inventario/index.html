<!DOCTYPE html>
<html lang="es-NI">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario · Negocios de Caña CASUR</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; }
  body {
    font-family: Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#e6ebf0; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(120% 60% at 50% -10%, #1c4355 0%, transparent 60%),
      linear-gradient(180deg, #102732 0%, #0e232d 100%);
  }
  .box { max-width: 460px; text-align:center; }
  .tile {
    width:76px; height:76px; margin:0 auto 18px; border-radius:12px;
    display:grid; place-items:center;
    background: radial-gradient(120% 120% at 30% 20%, #a7b6d566, transparent 70%), #163442;
    border:1px solid #a7b6d566; box-shadow:0 10px 24px rgba(0,0,0,.4);
    color:#a7b6d5;
  }
  .tile svg { width:38px; height:38px; }
  h1 { font-size:1.5rem; letter-spacing:-.02em; margin:0 0 6px; }
  p.sub { color:#B7C6D6; margin:0 0 18px; }
  .badge {
    display:inline-block; padding:7px 14px; border-radius:999px;
    background:#173644; border:1px solid rgba(155,190,225,.18);
    color:#7ac2d1; font-size:.85rem; font-weight:600;
  }
  .note { margin-top:22px; color:#7C90A6; font-size:.82rem; line-height:1.5; }
</style>
<link rel="stylesheet" href="../../shared/styles/module-theme.css">
</head>
<body>
  <div class="box">
    <div class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </div>
    <h1>Inventario</h1>
    <p class="sub">Kardex, entradas y salidas · Pansaco</p>
    <span class="badge">Integración prevista · Fase 7</span>
    <p class="note">Módulo cargado correctamente dentro del contenedor aislado de la App Maestra.
    En esta fase se muestra un marcador de posición; la aplicación real se integrará
    conservando su comportamiento y sus datos existentes.</p>
  </div>
</body>
</html>
