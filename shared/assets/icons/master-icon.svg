<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Negocios de Caña CASUR">
  <defs>
    <!-- Fondo azul marino de campo nocturno, identidad CASUR -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A4A"/>
      <stop offset="1" stop-color="#081A33"/>
    </linearGradient>
    <!-- Verde caña: lima a teal -->
    <linearGradient id="cane" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2FB39A"/>
      <stop offset="0.55" stop-color="#5FC24B"/>
      <stop offset="1" stop-color="#9FE06B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FE06B"/>
      <stop offset="1" stop-color="#4FBE7A"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE0FF"/>
      <stop offset="1" stop-color="#2FB39A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Placa de fondo redondeada -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Halo sutil de campo -->
  <ellipse cx="256" cy="150" rx="230" ry="120" fill="#12365F" opacity="0.5"/>

  <g filter="url(#soft)">
    <!-- Tallo de caña segmentado (diagonal, sube a la derecha) -->
    <g stroke="#0B2340" stroke-width="6" stroke-linecap="round">
      <path d="M196 392 C 214 320, 258 250, 300 176 C 322 138, 340 118, 356 108"
            fill="none" stroke="url(#cane)" stroke-width="38"/>
    </g>
    <!-- Nudos de la caña -->
    <g stroke="#0B2340" stroke-width="7" opacity="0.55">
      <line x1="210" y1="356" x2="240" y2="368"/>
      <line x1="236" y1="300" x2="266" y2="312"/>
      <line x1="266" y1="244" x2="296" y2="256"/>
      <line x1="300" y1="186" x2="330" y2="198"/>
    </g>

    <!-- Hoja izquierda -->
    <path d="M300 176 C 250 150, 196 156, 156 196 C 214 200, 262 196, 300 176 Z"
          fill="url(#leaf)"/>
    <!-- Hoja derecha -->
    <path d="M330 150 C 372 108, 428 100, 460 120 C 410 150, 366 160, 330 150 Z"
          fill="url(#leaf)"/>
    <!-- Hoja superior larga -->
    <path d="M356 108 C 356 60, 384 24, 424 8 C 420 60, 402 96, 356 108 Z"
          fill="url(#cane)"/>

    <!-- Gota de riego (nexo campo + agua, referencia Riego) -->
    <path d="M170 300 c 0 -22 22 -34 22 -34 s 22 12 22 34 a 22 22 0 0 1 -44 0 Z"
          fill="url(#drop)"/>
    <circle cx="184" cy="300" r="6" fill="#EAF7FF" opacity="0.7"/>
  </g>

  <!-- Base de tierra / surco -->
  <path d="M120 420 q 136 -34 272 0" fill="none" stroke="#C88A3C" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M120 420 q 136 -34 272 0" fill="none" stroke="#7DC94A" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
